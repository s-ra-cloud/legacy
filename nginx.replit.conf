daemon off;
worker_processes auto;
pid .data/nginx/nginx.pid;
error_log .data/nginx/logs/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       .data/nginx/mime.types;
  default_type  application/octet-stream;

  # Keep all writable state inside the project (Replit's /var, /etc are not writable)
  client_body_temp_path .data/nginx/tmp/client_body;
  proxy_temp_path       .data/nginx/tmp/proxy;
  fastcgi_temp_path     .data/nginx/tmp/fastcgi;
  uwsgi_temp_path       .data/nginx/tmp/uwsgi;
  scgi_temp_path        .data/nginx/tmp/scgi;

  access_log .data/nginx/logs/access.log;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Allow large uploads (e.g. via MinIO presigned PUT or app upload endpoints)
  client_max_body_size 1024m;

  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Upstreams (fill in real ports as your services come online)
  upstream app_upstream    { server 127.0.0.1:3000; }   # main dev server (placeholder)
  upstream minio_upstream  { server 127.0.0.1:9000; }   # MinIO S3 API
  # upstream api_upstream  { server 127.0.0.1:3001; }   # stub: future API service
  # upstream ws_upstream   { server 127.0.0.1:3002; }   # stub: future WS service

  server {
    listen 0.0.0.0:5000 default_server;
    server_name _;

    # ----- MinIO S3 API at /storage/ -----
    location /storage/ {
      # Strip the /storage prefix when forwarding to MinIO
      rewrite ^/storage/(.*)$ /$1 break;

      proxy_pass http://minio_upstream;
      proxy_http_version 1.1;

      # Large uploads + don't buffer
      client_max_body_size 5g;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout    600s;
      proxy_send_timeout    600s;

      # Standard proxy headers
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket / chunked upgrade headers
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # ----- Stub: future REST API mount -----
    location /api/ {
      # TODO: change upstream once api service is online
      proxy_pass http://app_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # ----- Stub: future WebSocket mount -----
    location /ws {
      # TODO: point at ws_upstream once a websocket service is added
      proxy_pass http://app_upstream;
      proxy_http_version 1.1;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # ----- Default: app dev server -----
    location / {
      proxy_pass http://app_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }
  }
}
