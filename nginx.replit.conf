daemon off;
worker_processes auto;
pid .data/nginx/nginx.pid;
error_log .data/nginx/logs/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       .data/nginx/mime.types;
  default_type  application/octet-stream;

  # Keep all writable state inside the project (Replit's /var, /etc are not writable)
  client_body_temp_path .data/nginx/tmp/client_body;
  proxy_temp_path       .data/nginx/tmp/proxy;
  fastcgi_temp_path     .data/nginx/tmp/fastcgi;
  uwsgi_temp_path       .data/nginx/tmp/uwsgi;
  scgi_temp_path        .data/nginx/tmp/scgi;

  access_log .data/nginx/logs/access.log;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  client_max_body_size 1024m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream client_upstream { server 127.0.0.1:5173; }   # React Router (client)
  upstream admin_upstream  { server 127.0.0.1:3001; }   # React Router (admin)
  upstream api_upstream    { server 127.0.0.1:3000; }   # Hono API
  upstream strapi_upstream { server 127.0.0.1:1337; }   # Strapi CMS
  upstream minio_upstream  { server 127.0.0.1:9000; }   # MinIO S3 API

  server {
    listen 0.0.0.0:5000 default_server;
    server_name _;

    # ----- MinIO S3 API -----
    location /storage/ {
      rewrite ^/storage/(.*)$ /$1 break;
      proxy_pass http://minio_upstream;
      proxy_http_version 1.1;

      client_max_body_size 5g;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # ----- Strapi CMS at /strapi/ -----
    # Strapi mounts admin at /admin internally but advertises URLs with the
    # /strapi prefix (because STRAPI_URL=/strapi). So we strip /strapi when
    # forwarding to the upstream — public URL /strapi/admin -> upstream /admin.
    location /strapi/ {
      proxy_pass http://strapi_upstream/;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  $server_port;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # Bare /strapi (no trailing slash) -> redirect to /strapi/admin
    location = /strapi {
      return 302 /strapi/admin;
    }

    # ----- Hono API at /api/ -----
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;

      proxy_buffering off;
      proxy_request_buffering off;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # ----- Admin app at /admin -----
    location /admin {
      proxy_pass http://admin_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # ----- WebSocket stub -----
    location /ws {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }

    # ----- Default: client app -----
    location / {
      proxy_pass http://client_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
    }
  }
}
