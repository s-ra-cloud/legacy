[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Owner-run Knowledge Tree recovery utilities"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
