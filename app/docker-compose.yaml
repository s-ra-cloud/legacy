services:
  db:
    container_name: legacy_database
    image: postgres:16
    restart: always
    volumes:
      - data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    env_file: .env
    networks:
      - network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    container_name: legacy_redis
    image: redis:7-alpine
    restart: always
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis:/data
    env_file: .env
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    container_name: legacy_minio
    image: "minio/minio:latest"
    restart: always
    command: server /data --console-address ":9001"
    volumes:
      - "minio:/data"
    env_file: .env
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    container_name: legacy_minio_init
    image: "minio/mc:latest"
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      sh -c "
      until mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'Waiting for MinIO to be ready...'; sleep 2;
      done;
      if ! mc admin accesskey list minio $$MINIO_ROOT_USER | grep $$MINIO_ACCESS_KEY; then
        echo 'Creating new access key...';
        mc admin accesskey create minio $$MINIO_ROOT_USER --access-key $$MINIO_ACCESS_KEY --secret-key $$MINIO_SECRET_KEY;
      else
        echo 'Access key already exists.';
      fi;
      if ! mc ls minio/$$MINIO_BUCKET_NAME > /dev/null 2>&1; then
        echo 'Creating bucket...';
        mc mb minio/$$MINIO_BUCKET_NAME;
      fi;
      "
    restart: "no"
    networks:
      - network

  app:
    build:
      context: .
    container_name: legacy_app
    image: legacy-app
    restart: always
    env_file:
      - .env
    volumes:
      - ./apps/strapi/public/uploads:/app/apps/strapi/public/uploads
      - ./apps/strapi/types:/app/apps/strapi/types
      - ./apps/strapi/src:/app/apps/strapi/src
      - ./apps/strapi/config:/app/apps/strapi/config
      - ./apps/strapi/.env:/app/apps/strapi/.env
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  server:
    image: nginx:alpine
    container_name: legacy_server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    ports:
      - "8080:80"
    networks:
      - network
    depends_on:
      - app

volumes:
  data:
  redis:
  minio:

networks:
  network:
    driver: bridge
